<title>Гараа Дасгалжуулагч</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Symbols+2&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: opening library | board | coach panel — collapses to board-first on phones */
:root {
  --bg: #e9ece7;
  --surface: #f8f9f6;
  --ink: #18201b;
  --muted: #5a675f;
  --line: #d2d9d2;
  --accent: #9a5a14;
  --accent-soft: #f1e2cc;
  --ok: #2a7d45;
  --bad: #b8392a;
  --warn: #b07d0c;
  --sq-light: #e8e2cc;
  --sq-dark: #7f9b84;
  --sq-last: rgba(240, 196, 60, .5);
  --sq-sel: rgba(66, 120, 220, .45);
  --font-display: "Unbounded", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --font-piece: "Noto Sans Symbols 2", "Segoe UI Symbol", "DejaVu Sans", "Apple Symbols", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614; --surface: #1a201d; --ink: #e3e8e3; --muted: #93a198; --line: #2b332f;
    --accent: #e0a453; --accent-soft: #3a2c19; --ok: #5cc27e; --bad: #ef7a63; --warn: #e5b84b;
    --sq-light: #c9c3ad; --sq-dark: #66806b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1a201d; --ink: #e3e8e3; --muted: #93a198; --line: #2b332f;
  --accent: #e0a453; --accent-soft: #3a2c19; --ok: #5cc27e; --bad: #ef7a63; --warn: #e5b84b;
  --sq-light: #c9c3ad; --sq-dark: #66806b; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 32px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { max-width: 1440px; margin: 0 auto 18px; display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: end; justify-content: space-between; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 2.6vw, 28px); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); max-width: 60ch; }
.overall { display: grid; gap: 6px; min-width: min(100%, 360px); }
.overall-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.overall-row b { color: var(--ink); font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .m { background: var(--ok); } .bar .l { background: var(--warn); }

.app { max-width: 1440px; margin: 0 auto; display: grid; gap: 20px;
  grid-template-columns: 290px minmax(0, 1fr) 340px; grid-template-areas: "side board panel"; align-items: start; }
.side { grid-area: side; min-width: 0; }
.stage { grid-area: board; min-width: 0; display: grid; justify-items: center; gap: 10px; }
.panel { grid-area: panel; min-width: 0; }
@media (max-width: 1120px) { .app { grid-template-columns: minmax(0, 1fr) 330px; grid-template-areas: "board panel" "side side"; } }
@media (max-width: 760px) { .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "board" "panel" "side"; } }

/* Board */
.board-wrap { position: relative; width: min(100%, 74vh, 680px); aspect-ratio: 1; max-width: 100%; }
.board { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
  border-radius: 6px; overflow: hidden; container-type: inline-size; touch-action: none; user-select: none; -webkit-user-select: none;
  box-shadow: 0 0 0 1px var(--line), 0 10px 30px -14px rgba(0,0,0,.35); }
.sq { position: relative; display: grid; place-items: center; }
.sq.light { background: var(--sq-light); } .sq.dark { background: var(--sq-dark); }
.sq.last::before, .sq.sel::before, .sq.hint::before, .sq.wrong::before, .sq.check::before { content: ""; position: absolute; inset: 0; }
.sq.last::before { background: var(--sq-last); }
.sq.sel::before { background: var(--sq-sel); }
.sq.hint::before { box-shadow: inset 0 0 0 4px var(--accent); background: rgba(224,164,83,.25); animation: pulse 1.1s ease-in-out infinite; }
.sq.wrong::before { background: rgba(214, 60, 40, .55); }
.sq.check::before { background: radial-gradient(circle, rgba(230,40,30,.85) 0%, rgba(230,40,30,.35) 45%, transparent 72%); }
@keyframes pulse { 50% { background: rgba(224,164,83,.05); } }
.pc { position: relative; font-family: var(--font-piece); font-size: 10.4cqw; line-height: 1; pointer-events: none; transform: translateY(-2%); }
.pc.w { color: #fbfaf5; text-shadow: 0 0 1px #1d1d1d, 1px 0 0 #1d1d1d, -1px 0 0 #1d1d1d, 0 1px 0 #1d1d1d, 0 -1px 0 #1d1d1d, 0 2px 3px rgba(0,0,0,.35); }
.pc.b { color: #1f2422; text-shadow: 0 0 1px rgba(255,255,255,.25), 0 2px 3px rgba(0,0,0,.3); }
.sq.dragging .pc { opacity: .3; }
.dot { position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(20,30,25,.28); pointer-events: none; }
.cap { position: absolute; inset: 4%; border-radius: 50%; box-shadow: inset 0 0 0 0.9cqw rgba(20,30,25,.3); pointer-events: none; }
.crd { position: absolute; font: 600 2.1cqw/1 var(--font-mono); pointer-events: none; opacity: .85; }
.crd.rk { top: 4%; left: 5%; } .crd.fl { bottom: 4%; right: 6%; }
.sq.light .crd { color: var(--sq-dark); } .sq.dark .crd { color: var(--sq-light); }
.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.ghost { position: absolute; pointer-events: none; font-family: var(--font-piece); line-height: 1; transform: translate(-50%, -55%); z-index: 5; }
.ghost.w { color: #fbfaf5; text-shadow: 0 0 1px #1d1d1d, 1px 0 0 #1d1d1d, -1px 0 0 #1d1d1d, 0 1px 0 #1d1d1d, 0 -1px 0 #1d1d1d, 0 6px 10px rgba(0,0,0,.35); }
.ghost.b { color: #1f2422; text-shadow: 0 6px 10px rgba(0,0,0,.35); }
.stage-bar { width: min(100%, 74vh, 680px); display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; }
.turn { display: inline-flex; align-items: center; gap: 8px; }
.turn i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--muted); }

/* Panels */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.panel .card { padding: 16px; display: grid; gap: 14px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: 8px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 10px; border-radius: 6px; font-weight: 500; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ptitle { font-family: var(--font-display); font-weight: 500; font-size: 17px; line-height: 1.3; margin: 2px 0 0; text-wrap: balance; }
.note { margin: 0; color: var(--ink); font-size: 14px; }
.moves { font-family: var(--font-mono); font-size: 14px; display: grid; grid-template-columns: 2.6em 1fr 1fr; gap: 2px 4px; align-items: center;
  max-height: 220px; overflow-y: auto; padding: 8px; background: var(--bg); border-radius: 8px; font-variant-numeric: tabular-nums; }
.moves .num { color: var(--muted); text-align: right; padding-right: 4px; }
.mv { border: 0; background: transparent; text-align: left; padding: 2px 6px; border-radius: 4px; font-family: inherit; }
.mv:hover { background: var(--line); }
.mv.cur { background: var(--accent); color: var(--surface); }
.mv.future { color: var(--muted); opacity: .7; }
.mv.pending { color: var(--muted); }
.ctrls { display: flex; gap: 6px; }
.ctrls button { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 8px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions .btn { flex: 1 1 auto; }
.msg { padding: 10px 12px; border-radius: 8px; font-size: 14px; background: var(--bg); border-left: 3px solid var(--muted); min-height: 44px; }
.msg.ok { border-color: var(--ok); } .msg.bad { border-color: var(--bad); } .msg.info { border-color: var(--accent); } .msg.done { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--bg)); }
.msg b { font-weight: 600; }
.kv { display: flex; gap: 16px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.kv b { color: var(--ink); }
.legend { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.legend code { font-family: var(--font-mono); color: var(--ink); }

/* Library */
.side .card { padding: 6px 0; }
.grp + .grp { border-top: 1px solid var(--line); }
.grp-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px 6px; }
.grp-h span { display: inline-flex; align-items: center; gap: 8px; }
.op summary { list-style: none; cursor: pointer; padding: 8px 14px; display: grid; gap: 5px; }
.op summary::-webkit-details-marker { display: none; }
.op summary:hover { background: var(--bg); }
.op-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.op-name { font-weight: 600; font-size: 14px; }
.op-eco { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.op-sub { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.op-sub .bar { flex: 1; height: 5px; }
.op-body { padding: 2px 14px 12px; display: grid; gap: 6px; }
.op-desc { font-size: 13px; color: var(--muted); margin: 0; }
.lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.ln { width: 100%; display: flex; align-items: center; gap: 9px; border: 0; background: transparent; text-align: left; padding: 5px 8px; border-radius: 6px; font-size: 13.5px; }
.ln:hover { background: var(--bg); }
.ln.cur { background: var(--accent-soft); }
.ln .st { flex: none; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); }
.st.learning { background: var(--warn); border-color: var(--warn); }
.st.mastered { background: var(--ok); border-color: var(--ok); }
.st.failed { background: var(--bad); border-color: var(--bad); }
.ln .due { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.keys { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 12px; color: var(--muted); padding: 10px 14px; border-top: 1px solid var(--line); }
.keys span { display: inline-flex; align-items: center; gap: 6px; }
.reset { padding: 10px 14px 6px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.linkbtn { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 0; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .sq.hint::before { animation: none; } }
</style>

<header class="top">
  <div class="brand">
    <h1>Гараа Дасгалжуулагч</h1>
    <p>Гараагаа сумаар судалж, дараа нь өөрөө нүүж давт. Алдсан хувилбар дахин дахин гарна, цээжилсэн нь хойш зайтай давтагдана.</p>
  </div>
  <div class="overall" id="overall"></div>
</header>

<main class="app">
  <aside class="side"><div class="card" id="library"></div></aside>
  <section class="stage">
    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board" aria-label="Шатрын самбар"></div>
      <svg class="arrows" id="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg>
      <div class="ghost" id="ghost" hidden></div>
    </div>
    <div class="stage-bar">
      <span class="turn" id="turn"></span>
      <button class="btn small" id="flipBtn" type="button">Самбар эргүүлэх</button>
    </div>
  </section>
  <aside class="panel"><div class="card" id="panel"></div></aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

const GLYPH = { k: '♚︎', q: '♛︎', r: '♜︎', b: '♝︎', n: '♞︎', p: '♟︎' };
const FILES = 'abcdefgh';
const DAY = 864e5;
const INTERVALS = [0, 5 * 6e4, 36e5, DAY, 3 * DAY, 7 * DAY, 21 * DAY];
const INTERVAL_TXT = ['одоо', '5 минутын', '1 цагийн', '1 өдрийн', '3 өдрийн', '7 хоногийн', '3 долоо хоногийн'];
const MASTER_BOX = 3;
const STORE_KEY = 'gara-trainer-v1';
const strip = s => s.replace(/[+#?!]/g, '');
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function findMove(g, san) {
  const t = strip(san);
  return g.moves({ verbose: true }).find(m => strip(m.san) === t);
}

// Validate every line once and keep the canonical SAN from chess.js
const LINES = [];
for (const o of OPENINGS) {
  o.lineObjs = [];
  o.lines.forEach((l, i) => {
    const g = new Chess(), moves = [];
    for (const s of l.m.split(/\s+/)) {
      const mv = findMove(g, s);
      if (!mv) { console.error('Буруу нүүдэл:', o.id, l.n, s); return; }
      g.move({ from: mv.from, to: mv.to, promotion: mv.promotion });
      moves.push(mv.san);
    }
    const line = { id: o.id + ':' + i, o, name: l.n, note: l.t, moves };
    LINES.push(line); o.lineObjs.push(line);
  });
}
const byId = id => LINES.find(l => l.id === id);

// Progress (per-browser)
let P = { lines: {}, daily: { date: '', n: 0 } };
try { const raw = localStorage.getItem(STORE_KEY); if (raw) P = Object.assign(P, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(P)); } catch (e) {} }
const prog = id => P.lines[id] || (P.lines[id] = { box: 0, seen: false, reps: 0, fails: 0, due: 0, last: 0 });
const peek = id => P.lines[id];
const todayKey = () => new Date().toISOString().slice(0, 10);
function status(id) {
  const p = peek(id);
  if (!p || !p.seen) return 'new';
  if (p.box >= MASTER_BOX) return 'mastered';
  if (p.box === 0 && p.fails > 0) return 'failed';
  return 'learning';
}
function dueText(id) {
  const p = peek(id);
  if (!p || !p.seen) return 'шинэ';
  const d = p.due - Date.now();
  if (d <= 0) return 'одоо';
  if (d < 36e5) return Math.ceil(d / 6e4) + ' мин';
  if (d < DAY) return Math.round(d / 36e5) + ' цаг';
  return Math.round(d / DAY) + ' өдөр';
}

const S = {
  mode: 'learn', line: OPENINGS[0].lineObjs[0], ply: 0, game: new Chess(), orient: 'w',
  selected: null, lastMove: null, arrow: null, hintSq: null, flash: null, drag: null,
  pool: [], poolLabel: '', mistakes: 0, posMistakes: 0, busy: false, finished: false,
  requeue: null, lastLineId: null, msg: null, openOps: new Set(['italian']), confirmReset: false, oppTimer: null,
};

/* ---------- Learn mode ---------- */
function startLearn(line, ply = 0) {
  clearTimeout(S.oppTimer);
  S.mode = 'learn'; S.line = line; S.orient = line.o.side; S.openOps.add(line.o.id);
  S.msg = { type: 'info', text: 'Сум дараагийн нүүдлийг харуулна. Самбар дээр өөрөө нүүж эсвэл ▶ товчоор урагшил.' };
  setLearnPos(ply);
  renderLibrary();
}
function setLearnPos(ply) {
  const L = S.line;
  S.ply = Math.max(0, Math.min(ply, L.moves.length));
  S.game = new Chess(); S.lastMove = null;
  for (let i = 0; i < S.ply; i++) { const mv = S.game.move(L.moves[i]); S.lastMove = { from: mv.from, to: mv.to }; }
  S.selected = null; S.hintSq = null;
  if (S.ply < L.moves.length) { const nx = findMove(S.game, L.moves[S.ply]); S.arrow = { from: nx.from, to: nx.to, kind: 'next' }; }
  else { S.arrow = null; S.msg = { type: 'done', text: `<b>${esc(L.name)}</b> хувилбарын төгсгөл. Одоо өөрөө давтаж үзээрэй.` }; }
  renderAll();
}
function learnMove(mv) {
  const exp = S.line.moves[S.ply];
  if (strip(mv.san) === strip(exp)) {
    S.msg = { type: 'ok', text: `Зөв — <b>${esc(mv.san)}</b>` };
    setLearnPos(S.ply + 1);
  } else {
    S.msg = { type: 'bad', text: `${esc(mv.san)} энэ хувилбарт байхгүй. Сумыг дагаарай: <b>${esc(exp)}</b>.` };
    flash([mv.from, mv.to]); renderPanel();
  }
}

/* ---------- Drill mode ---------- */
function startDrill(pool, label) {
  S.mode = 'drill'; S.pool = pool; S.poolLabel = label; S.requeue = null;
  loadDrillLine(pickLine(pool));
}
function pickLine(pool) {
  const now = Date.now();
  if (S.requeue && pool.includes(S.requeue)) { const l = S.requeue; S.requeue = null; return l; }
  let cands = pool.filter(l => l.id !== S.lastLineId);
  if (!cands.length) cands = pool;
  const seen = l => peek(l.id) && peek(l.id).seen;
  const due = cands.filter(l => seen(l) && peek(l.id).due <= now);
  const fresh = cands.filter(l => !seen(l));
  const best = arr => arr.slice().sort((a, b) => peek(a.id).box - peek(b.id).box || peek(a.id).due - peek(b.id).due)[0];
  const urgent = due.filter(l => peek(l.id).box <= 1);
  if (urgent.length) return best(urgent);
  if (fresh.length) return fresh[0];
  if (due.length) return best(due);
  return cands.slice().sort((a, b) => peek(a.id).due - peek(b.id).due)[0];
}
function loadDrillLine(L) {
  clearTimeout(S.oppTimer);
  Object.assign(S, { line: L, lastLineId: L.id, game: new Chess(), ply: 0, mistakes: 0, posMistakes: 0, finished: false,
    busy: false, arrow: null, hintSq: null, lastMove: null, selected: null, orient: L.o.side });
  S.openOps.add(L.o.id);
  if (L.o.side === 'b') { S.msg = { type: 'info', text: 'Цагаан эхэлнэ…' }; scheduleOpp(); }
  else userTurn(null);
  renderAll(); renderLibrary();
}
const userColor = () => S.line.o.side;
function play(mv) { S.game.move({ from: mv.from, to: mv.to, promotion: mv.promotion }); S.lastMove = { from: mv.from, to: mv.to }; }
function scheduleOpp() {
  S.busy = true;
  S.oppTimer = setTimeout(() => {
    const mv = findMove(S.game, S.line.moves[S.ply]);
    play(mv); S.ply++; S.busy = false;
    if (S.ply >= S.line.moves.length) finish(); else userTurn(mv.san);
    renderAll();
  }, 520);
}
// Repertoire moves that are also correct here (other lines sharing this exact move order)
function altMoves() {
  const L = S.line, pre = L.moves.slice(0, S.ply).map(strip).join(' ');
  const set = new Set();
  for (const l of S.pool) if (l.moves.length > S.ply && l.moves.slice(0, S.ply).map(strip).join(' ') === pre) set.add(strip(l.moves[S.ply]));
  return set;
}
function userTurn(oppSan) {
  S.posMistakes = 0; S.hintSq = null; S.arrow = null;
  let text = oppSan ? `Өрсөлдөгч <b>${esc(oppSan)}</b> нүүлээ. Таны ээлж.` : `Таны ээлж — ${userColor() === 'w' ? 'цагаанаар' : 'хараар'} тоглоно.`;
  if (altMoves().size > 1) text += `<br>Энд репертуарт хэд хэдэн нүүдэл бий — энэ удаа <b>${esc(S.line.o.name)}: ${esc(S.line.name)}</b>.`;
  S.msg = { type: 'info', text };
}
function drillMove(mv) {
  const L = S.line, exp = L.moves[S.ply];
  if (strip(mv.san) === strip(exp)) {
    play(mv); S.ply++; S.arrow = null; S.hintSq = null;
    S.msg = { type: 'ok', text: `Зөв — <b>${esc(mv.san)}</b>` };
    if (S.ply >= L.moves.length) finish(); else scheduleOpp();
    renderAll(); return;
  }
  if (altMoves().has(strip(mv.san))) {
    S.msg = { type: 'info', text: `<b>${esc(mv.san)}</b> ч бас таны репертуарт бий, гэхдээ энэ удаа <b>${esc(L.name)}</b> хувилбарыг давтаж байна.` };
    flash([mv.from, mv.to]); renderPanel(); return;
  }
  S.mistakes++; S.posMistakes++;
  flash([mv.from, mv.to]);
  if (S.posMistakes >= 2) S.msg = { type: 'bad', text: `${esc(mv.san)} — буруу (${S.posMistakes} дахь удаа). Санаж чадахгүй бол «Санамж» эсвэл «Хариу харах» товчийг дар.` };
  else S.msg = { type: 'bad', text: `${esc(mv.san)} — буруу. Дахин оролдоорой.` };
  renderAll();
}
function hint() {
  if (S.mode !== 'drill' || S.finished || S.busy) return;
  const exp = findMove(S.game, S.line.moves[S.ply]);
  if (!S.hintSq) S.mistakes++;
  S.hintSq = exp.from;
  S.msg = { type: 'info', text: 'Санамж: тодруулсан нүдний дүрсийг нүү.' };
  renderAll();
}
function revealAnswer(count = true) {
  if (S.mode !== 'drill' || S.finished || S.busy) return;
  const exp = findMove(S.game, S.line.moves[S.ply]);
  if (count && S.arrow?.kind !== 'answer') S.mistakes++;
  S.arrow = { from: exp.from, to: exp.to, kind: 'answer' };
  if (count) S.msg = { type: 'info', text: `Зөв нүүдэл: <b>${esc(exp.san)}</b>. Одоо өөрөө нүү.` };
  renderAll();
}
function finish() {
  S.finished = true; S.arrow = null; S.hintSq = null;
  const L = S.line, p = prog(L.id);
  const t = todayKey(); if (P.daily.date !== t) P.daily = { date: t, n: 0 };
  P.daily.n++; p.reps++; p.last = Date.now();
  let text;
  if (S.mistakes === 0) {
    p.seen = true; p.box = Math.min(INTERVALS.length - 1, p.box + 1); p.due = Date.now() + INTERVALS[p.box];
    text = `Төгс! <b>${esc(L.name)}</b> — алдаагүй.${p.box >= MASTER_BOX ? ' Цээжилсэн.' : ''} Дараагийн давталт ${INTERVAL_TXT[p.box]} дараа.`;
  } else {
    p.seen = true; p.box = 0; p.fails++; p.due = Date.now(); S.requeue = L;
    text = `<b>${esc(L.name)}</b> дууслаа — ${S.mistakes} алдаатай. Энэ хувилбарыг шууд дахин давтана.`;
  }
  save();
  S.msg = { type: 'done', text };
  renderLibrary(); renderOverall();
}

/* ---------- Board interaction ---------- */
function interactive() {
  if (S.mode === 'learn') return S.ply < S.line.moves.length;
  return !S.busy && !S.finished && S.game.turn() === userColor();
}
const canMovePiece = p => p && interactive() && p.color === S.game.turn();
function sqFromPoint(x, y) {
  const r = $('#board').getBoundingClientRect();
  const col = Math.floor((x - r.left) / r.width * 8), row = Math.floor((y - r.top) / r.height * 8);
  if (col < 0 || col > 7 || row < 0 || row > 7) return null;
  const f = S.orient === 'w' ? col : 7 - col, rk = S.orient === 'w' ? 7 - row : row;
  return FILES[f] + (rk + 1);
}
function clickSq(sq) {
  if (S.selected && S.game.moves({ square: S.selected, verbose: true }).some(m => m.to === sq)) { tryMove(S.selected, sq); return; }
  const p = S.game.get(sq);
  S.selected = canMovePiece(p) && S.selected !== sq ? sq : null;
  renderBoard();
}
function tryMove(from, to) {
  const mv = S.game.moves({ square: from, verbose: true }).find(m => m.to === to && (!m.promotion || m.promotion === 'q'));
  S.selected = null;
  if (!mv) { renderBoard(); return; }
  if (S.mode === 'learn') learnMove(mv); else drillMove(mv);
}
function flash(sqs) {
  S.flash = sqs; renderBoard();
  setTimeout(() => { S.flash = null; renderBoard(); }, 650);
}
const boardEl = $('#board'), ghost = $('#ghost');
boardEl.addEventListener('pointerdown', e => {
  const sq = sqFromPoint(e.clientX, e.clientY); if (!sq) return;
  const p = S.game.get(sq);
  if (canMovePiece(p)) { S.drag = { from: sq, x: e.clientX, y: e.clientY, moved: false, p }; boardEl.setPointerCapture(e.pointerId); }
  else S.drag = null;
});
boardEl.addEventListener('pointermove', e => {
  const d = S.drag; if (!d) return;
  if (!d.moved && Math.hypot(e.clientX - d.x, e.clientY - d.y) > 5) {
    d.moved = true; S.selected = d.from; renderBoard();
    ghost.className = 'ghost ' + d.p.color; ghost.textContent = GLYPH[d.p.type];
    ghost.style.fontSize = (boardEl.clientWidth * .104) + 'px'; ghost.hidden = false;
  }
  if (d.moved) { const r = $('#boardWrap').getBoundingClientRect(); ghost.style.left = (e.clientX - r.left) + 'px'; ghost.style.top = (e.clientY - r.top) + 'px'; }
});
boardEl.addEventListener('pointerup', e => {
  const sq = sqFromPoint(e.clientX, e.clientY), d = S.drag; S.drag = null; ghost.hidden = true;
  if (d && d.moved) { if (sq && sq !== d.from) tryMove(d.from, sq); else renderBoard(); }
  else if (sq) clickSq(sq);
});
boardEl.addEventListener('pointercancel', () => { S.drag = null; ghost.hidden = true; renderBoard(); });

/* ---------- Rendering ---------- */
function renderBoard() {
  const legal = S.selected ? S.game.moves({ square: S.selected, verbose: true }) : [];
  const legalTo = new Set(legal.map(m => m.to));
  const inCheck = S.game.in_check(), turn = S.game.turn();
  let html = '';
  for (let row = 0; row < 8; row++) for (let col = 0; col < 8; col++) {
    const f = S.orient === 'w' ? col : 7 - col, r = S.orient === 'w' ? 7 - row : row;
    const sq = FILES[f] + (r + 1), p = S.game.get(sq);
    const cls = ['sq', (f + r) % 2 === 0 ? 'dark' : 'light'];
    if (S.lastMove && (S.lastMove.from === sq || S.lastMove.to === sq)) cls.push('last');
    if (S.selected === sq) cls.push('sel');
    if (S.hintSq === sq) cls.push('hint');
    if (S.flash && S.flash.includes(sq)) cls.push('wrong');
    if (inCheck && p && p.type === 'k' && p.color === turn) cls.push('check');
    if (S.drag && S.drag.moved && S.drag.from === sq) cls.push('dragging');
    let inner = '';
    if (col === 0) inner += `<span class="crd rk">${r + 1}</span>`;
    if (row === 7) inner += `<span class="crd fl">${FILES[f]}</span>`;
    if (p) inner += `<span class="pc ${p.color}">${GLYPH[p.type]}</span>`;
    if (legalTo.has(sq)) inner += `<span class="${p ? 'cap' : 'dot'}"></span>`;
    html += `<div class="${cls.join(' ')}" data-sq="${sq}">${inner}</div>`;
  }
  boardEl.innerHTML = html;
  renderArrow();
  const t = S.game.turn();
  $('#turn').innerHTML = `<i style="background:${t === 'w' ? '#fbfaf5' : '#1f2422'}"></i>${t === 'w' ? 'Цагааны' : 'Харын'} нүүдэл`;
}
function center(sq) {
  const f = FILES.indexOf(sq[0]), r = +sq[1] - 1;
  return S.orient === 'w' ? [f + .5, 7 - r + .5] : [7 - f + .5, r + .5];
}
function renderArrow() {
  const svg = $('#arrows');
  if (!S.arrow) { svg.innerHTML = ''; return; }
  const [x1, y1] = center(S.arrow.from), [x2, y2] = center(S.arrow.to);
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len, px = -uy, py = ux;
  const hl = .4, hw = .24, sw = .085;
  const ex = x2 - ux * .1, ey = y2 - uy * .1, bx = ex - ux * hl, by = ey - uy * hl, sx = x1 + ux * .18, sy = y1 + uy * .18;
  const pts = [[sx + px * sw, sy + py * sw], [bx + px * sw, by + py * sw], [bx + px * hw, by + py * hw], [ex, ey],
    [bx - px * hw, by - py * hw], [bx - px * sw, by - py * sw], [sx - px * sw, sy - py * sw]].map(p => p.map(v => v.toFixed(3)).join(',')).join(' ');
  const color = S.arrow.kind === 'answer' ? '#1f9a4b' : '#d98b1c';
  svg.innerHTML = `<polygon points="${pts}" fill="${color}" fill-opacity=".82"/>`;
}
function movesHTML(moves, cur, upto) {
  let h = '';
  for (let i = 0; i < moves.length || (i === upto && i < moves.length); i += 2) {
    h += `<span class="num">${i / 2 + 1}.</span>`;
    for (const j of [i, i + 1]) {
      if (j >= moves.length) { h += '<span></span>'; continue; }
      const c = ['mv'];
      if (j === cur - 1) c.push('cur');
      if (j >= upto) c.push('future');
      h += `<button class="${c.join(' ')}" data-ply="${j + 1}" type="button">${esc(moves[j])}</button>`;
    }
  }
  return h;
}
function drillMovesHTML() {
  const shown = S.line.moves.slice(0, S.ply);
  let h = '';
  const total = S.finished ? shown.length : shown.length + 1;
  for (let i = 0; i < total; i += 2) {
    h += `<span class="num">${i / 2 + 1}.</span>`;
    for (const j of [i, i + 1]) {
      if (j < shown.length) h += `<span class="mv${j === shown.length - 1 ? ' cur' : ''}">${esc(shown[j])}</span>`;
      else if (j === shown.length && !S.finished) h += '<span class="mv pending">…</span>';
      else h += '<span></span>';
    }
  }
  return h;
}
function renderPanel() {
  const L = S.line, el = $('#panel');
  const seg = `<div class="seg" role="tablist">
    <button type="button" class="${S.mode === 'learn' ? 'on' : ''}" data-act="mode-learn">Судлах</button>
    <button type="button" class="${S.mode === 'drill' ? 'on' : ''}" data-act="mode-drill">Давтах</button></div>`;
  const msg = S.msg ? `<div class="msg ${S.msg.type}" aria-live="polite">${S.msg.text}</div>` : '';
  const legend = `<div class="legend">Тэмдэглэгээ: <code>K</code> ноён · <code>Q</code> бэрс · <code>R</code> тэрэг · <code>B</code> тэмээ · <code>N</code> морь · үсэггүй — хүү · <code>x</code> идэх · <code>+</code> шаг · <code>O-O</code> сэлгэлт</div>`;
  if (S.mode === 'learn') {
    const n = L.moves.length;
    el.innerHTML = `${seg}
      <div><div class="eyebrow">${esc(L.o.name)} · ${L.o.side === 'w' ? 'цагаанаар' : 'хараар'}</div><h2 class="ptitle">${esc(L.name)}</h2></div>
      <p class="note">${esc(L.note)}</p>
      <div class="moves">${movesHTML(L.moves, S.ply, n)}</div>
      <div class="ctrls">
        <button class="btn" type="button" data-act="first" aria-label="Эхлэл" ${S.ply === 0 ? 'disabled' : ''}>⏮</button>
        <button class="btn" type="button" data-act="prev" aria-label="Өмнөх" ${S.ply === 0 ? 'disabled' : ''}>◀</button>
        <button class="btn" type="button" data-act="next" aria-label="Дараах" ${S.ply >= n ? 'disabled' : ''}>▶</button>
        <button class="btn" type="button" data-act="last" aria-label="Төгсгөл" ${S.ply >= n ? 'disabled' : ''}>⏭</button>
      </div>
      ${msg}
      <div class="actions">
        <button class="btn primary" type="button" data-act="drill-line">Энэ хувилбарыг давтах</button>
        <button class="btn" type="button" data-act="drill-op" data-op="${L.o.id}">Бүх ${L.o.lineObjs.length} хувилбар</button>
      </div>
      ${legend}`;
  } else {
    const p = peek(L.id);
    el.innerHTML = `${seg}
      <div><div class="eyebrow">Давтлага · ${esc(S.poolLabel)}</div>
        <h2 class="ptitle">${esc(L.o.name)}${S.finished ? ': ' + esc(L.name) : ''}</h2></div>
      <div class="kv"><span>Алдаа <b>${S.mistakes}</b></span><span>Нүүдэл <b>${S.ply}/${L.moves.length}</b></span><span>Түвшин <b>${p ? p.box : 0}/${INTERVALS.length - 1}</b></span></div>
      <div class="moves">${drillMovesHTML()}</div>
      ${msg}
      <div class="actions">${S.finished
        ? `<button class="btn primary" type="button" data-act="next-line">Дараагийн хувилбар ↵</button>
           <button class="btn" type="button" data-act="retry">Дахин</button>
           <button class="btn" type="button" data-act="study-line">Судлах</button>`
        : `<button class="btn" type="button" data-act="hint" ${interactive() ? '' : 'disabled'}>Санамж (H)</button>
           <button class="btn" type="button" data-act="reveal" ${interactive() ? '' : 'disabled'}>Хариу харах</button>
           <button class="btn" type="button" data-act="retry">Эхнээс</button>`}
      </div>
      ${legend}`;
  }
}
function counts(lines) {
  let m = 0, l = 0;
  for (const x of lines) { const s = status(x.id); if (s === 'mastered') m++; else if (s !== 'new') l++; }
  return { m, l, n: lines.length };
}
function barHTML(c) { return `<div class="bar"><i class="m" style="width:${c.m / c.n * 100}%"></i><i class="l" style="width:${c.l / c.n * 100}%"></i></div>`; }
function renderOverall() {
  const c = counts(LINES), today = P.daily.date === todayKey() ? P.daily.n : 0;
  const due = LINES.filter(l => peek(l.id) && peek(l.id).seen && peek(l.id).due <= Date.now()).length;
  $('#overall').innerHTML = `<div class="overall-row"><span>Цээжилсэн <b>${c.m} / ${c.n}</b> хувилбар</span><span>Өнөөдөр <b>${today}</b> давталт · Хугацаа болсон <b>${due}</b></span></div>${barHTML(c)}`;
}
function renderLibrary() {
  const grp = side => {
    const ops = OPENINGS.filter(o => o.side === side);
    return `<div class="grp"><div class="grp-h"><span class="eyebrow"><span class="turn"><i style="background:${side === 'w' ? '#fbfaf5' : '#1f2422'}"></i></span>${side === 'w' ? 'Цагаанаар' : 'Хараар'}</span>
      <button class="btn small" type="button" data-act="drill-side" data-side="${side}">Бүгдийг давтах</button></div>
      ${ops.map(o => {
        const c = counts(o.lineObjs);
        return `<details class="op" data-op="${o.id}" ${S.openOps.has(o.id) ? 'open' : ''}>
          <summary><div class="op-h"><span class="op-name">${esc(o.name)}</span><span class="op-eco">${o.eco}</span></div>
            <div class="op-sub">${barHTML(c)}<span>${c.m}/${c.n}</span></div></summary>
          <div class="op-body"><p class="op-desc">${esc(o.desc)}</p>
            <ul class="lines">${o.lineObjs.map(l => `<li><button type="button" class="ln${S.line === l ? ' cur' : ''}" data-line="${l.id}">
              <span class="st ${status(l.id)}"></span><span>${esc(l.name)}</span><span class="due">${dueText(l.id)}</span></button></li>`).join('')}</ul>
            <button class="btn small" type="button" data-act="drill-op" data-op="${o.id}">«${esc(o.name)}» давтах</button></div>
        </details>`;
      }).join('')}</div>`;
  };
  $('#library').innerHTML = grp('w') + grp('b') +
    `<div class="keys"><span><i class="st" style="width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)"></i>Шинэ</span>
      <span><i class="st learning" style="width:9px;height:9px;border-radius:50%"></i>Сурч байгаа</span>
      <span><i class="st failed" style="width:9px;height:9px;border-radius:50%"></i>Алдсан</span>
      <span><i class="st mastered" style="width:9px;height:9px;border-radius:50%"></i>Цээжилсэн</span></div>
    <div class="reset">${S.confirmReset
      ? `Бүх явц устана. <button class="btn small" type="button" data-act="reset-yes">Тийм, арилгах</button><button class="linkbtn" type="button" data-act="reset-no">Болих</button>`
      : `<button class="linkbtn" type="button" data-act="reset">Явцыг арилгах</button>`}</div>`;
}
function renderAll() { renderBoard(); renderPanel(); renderOverall(); }

/* ---------- Events ---------- */
$('#library').addEventListener('toggle', e => {
  const d = e.target.closest('details.op'); if (!d) return;
  d.open ? S.openOps.add(d.dataset.op) : S.openOps.delete(d.dataset.op);
}, true);
document.addEventListener('click', e => {
  const ln = e.target.closest('[data-line]');
  if (ln) { startLearn(byId(ln.dataset.line)); return; }
  const mvb = e.target.closest('.mv[data-ply]');
  if (mvb && S.mode === 'learn') { S.msg = null; setLearnPos(+mvb.dataset.ply); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'first') setLearnPos(0);
  else if (a === 'prev') setLearnPos(S.ply - 1);
  else if (a === 'next') setLearnPos(S.ply + 1);
  else if (a === 'last') setLearnPos(S.line.moves.length);
  else if (a === 'drill-line') startDrill([S.line], S.line.name);
  else if (a === 'drill-op' || a === 'mode-drill') {
    if (a === 'mode-drill' && S.mode === 'drill') return;
    const o = OPENINGS.find(x => x.id === (b.dataset.op || S.line.o.id));
    startDrill(o.lineObjs, o.name);
  }
  else if (a === 'drill-side') { const s = b.dataset.side; startDrill(LINES.filter(l => l.o.side === s), s === 'w' ? 'Бүх цагаан гараа' : 'Бүх хар гараа'); }
  else if (a === 'mode-learn' || a === 'study-line') { if (S.mode !== 'learn') startLearn(S.line); }
  else if (a === 'next-line') loadDrillLine(pickLine(S.pool));
  else if (a === 'retry') { S.requeue = null; loadDrillLine(S.line); }
  else if (a === 'hint') hint();
  else if (a === 'reveal') revealAnswer(true);
  else if (a === 'reset') { S.confirmReset = true; renderLibrary(); }
  else if (a === 'reset-no') { S.confirmReset = false; renderLibrary(); }
  else if (a === 'reset-yes') { P = { lines: {}, daily: { date: '', n: 0 } }; save(); S.confirmReset = false; renderLibrary(); renderAll(); }
});
$('#flipBtn').addEventListener('click', () => { S.orient = S.orient === 'w' ? 'b' : 'w'; renderBoard(); });
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (S.mode === 'learn') {
    if (e.key === 'ArrowRight') { setLearnPos(S.ply + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { setLearnPos(S.ply - 1); e.preventDefault(); }
  } else {
    if (e.key === 'Enter' && S.finished && !e.target.closest('button')) { loadDrillLine(pickLine(S.pool)); e.preventDefault(); }
    else if (e.key === 'h' || e.key === 'H' || e.key === 'һ') hint();
  }
});
// Refresh "due" labels once a minute
setInterval(() => { renderLibrary(); renderOverall(); }, 6e4);

startLearn(S.line);
</script>
